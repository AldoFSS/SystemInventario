
      - name: Ejecutar sistema
        shell: pwsh
        run: |
          $resultado = & "./despliegue/Sistema-de-inventario.exe"
          $codigoSalida = $LASTEXITCODE

          $resultado | Out-Host

          if ($codigoSalida -ne 0) {
            throw "El programa termino con un error"
          }

          $texto = $resultado -join "`n"

          if ($texto -notmatch "PROD001" -or
              $texto -notmatch "Laptop Lenovo") {
            throw "Los datos del producto no son correctos"
          }

          Write-Host "Despliegue verificado correctamente"
