
name: Construccion del sistema de inventarios

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: dotnet restore Sistema-de-inventario.csproj

      - name: Compilar proyecto
        run: dotnet build Sistema-de-inventario.csproj --configuration Release --no-restore
