
name: Pruebas automatizadas del inventario

on:
  push:
    branches:
      - main
      - test/pruebas-producto
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: dotnet restore tests/Inventario.Tests/Inventario.Tests.csproj

      - name: Ejecutar pruebas
        run: dotnet test tests/Inventario.Tests/Inventario.Tests.csproj --configuration Release --no-restore
